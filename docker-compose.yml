services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  qdrant:
    image: docker.io/qdrant/qdrant:v1.20.0
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"

  vllm:
    image: docker.io/vllm/vllm-openai:v0.32.0
    container_name: rag-vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    # Qwen3 通过 hermes 解析工具调用；如果所用 vLLM 版本不支持，先删掉
    # --enable-auto-tool-choice / --tool-call-parser 两行再启动（RAG 模式不需要）。
    command:
      - --model
      - Qwen/Qwen3-4B-AWQ
      - --quantization
      - awq
      - --dtype
      - half
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.80"
      - --max-num-seqs
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${RAG_API_IMAGE:-pdf-rag-api:local}
    container_name: rag-api
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内通过 compose 网络访问基础服务，覆盖 .env 里的 localhost 地址
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: http://vllm:8000/v1
      STORAGE_DIR: /data/storage
      HF_HOME: /models
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ${STORAGE_HOST_DIR:-./storage}:/data/storage
      - ${HF_CACHE_DIR:-./data/huggingface}:/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4.0"
        reservations:
          memory: 2g

volumes:
  postgres_data:
  qdrant_data:
  huggingface_cache:
